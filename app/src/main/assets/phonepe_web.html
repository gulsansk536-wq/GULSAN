<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PhonePe UI Clone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
    </style>
</head>
<body class="bg-[#121212] text-white font-sans antialiased">

    <div class="max-w-md mx-auto bg-[#1a1a1a] min-h-screen pb-20 shadow-xl relative">
        
        <!-- Top Header Section -->
        <div class="flex justify-between items-center p-4 bg-[#1e1e1e]">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-yellow-500 flex items-center justify-center text-black font-bold text-lg cursor-pointer">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-1 cursor-pointer">
                        <span class="font-bold text-sm">Home</span>
                        <i class="fa-solid fa-angle-down text-xs"></i>
                    </div>
                    <p class="text-xs text-gray-400">Add Address</p>
                </div>
            </div>
            <div class="flex items-center space-x-4 text-lg text-gray-300">
                <i class="fa-regular fa-bell cursor-pointer"></i>
                <i class="fa-regular fa-circle-question cursor-pointer"></i>
            </div>
        </div>

        <!-- Banner Section -->
        <div class="p-4">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-900 rounded-2xl p-4 relative overflow-hidden flex justify-between items-center shadow-md">
                <div>
                    <p class="text-xs text-blue-200">Turn <span class="font-bold text-white">₹100/day</span> into</p>
                    <h2 class="text-2xl font-black text-white mt-1">₹37,610<span class="text-xs">/yr</span></h2>
                    <button class="mt-3 bg-blue-500 hover:bg-blue-600 active:scale-95 transition-transform text-white text-xs font-semibold px-4 py-2 rounded-full shadow">
                        Start Daily RD
                    </button>
                </div>
                <div class="text-right">
                    <span class="bg-blue-400 text-blue-950 text-[10px] font-bold px-2 py-1 rounded-full">Withdraw anytime</span>
                </div>
            </div>
        </div>

        <!-- Money Transfers Section -->
        <div class="px-4 mt-2">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm text-gray-200">Money Transfers</h3>
                <span class="text-xs bg-orange-950 text-orange-400 px-2 py-0.5 rounded-full border border-orange-800 cursor-pointer">Refer ➔ ₹50</span>
            </div>
            <div class="grid grid-cols-4 gap-2 text-center bg-[#242424] p-3 rounded-2xl">
                <div class="flex flex-col items-center cursor-pointer active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-full bg-purple-900 flex items-center justify-center text-purple-300 text-xl mb-1">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">To Mobile Number</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-full bg-purple-900 flex items-center justify-center text-purple-300 text-xl mb-1">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">To Bank & Self A/c</span>
                </div>
                <div class="flex flex-col items-center relative cursor-pointer active:scale-95 transition-transform">
                    <span class="absolute -top-2 right-0 bg-amber-500 text-black text-[9px] font-bold px-1 rounded">Cashback</span>
                    <div class="w-12 h-12 rounded-full bg-purple-900 flex items-center justify-center text-purple-300 text-xl mb-1">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">PhonePe Wallet</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-full bg-purple-900 flex items-center justify-center text-purple-300 text-xl mb-1">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">Check Balance</span>
                </div>
            </div>
        </div>

        <!-- Recharge & Bills Section -->
        <div class="px-4 mt-5">
            <h3 class="font-bold text-sm text-gray-200 mb-3">Recharge & Bills</h3>
            <div class="grid grid-cols-4 gap-2 text-center bg-[#242424] p-3 rounded-2xl">
                <div class="flex flex-col items-center cursor-pointer active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-blue-400 text-xl mb-1">
                        <i class="fa-solid fa-mobile"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">Mobile Recharge</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-red-400 text-xl mb-1">
                        <i class="fa-solid fa-house"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">Rent via Credit Card</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-orange-400 text-xl mb-1">
                        <i class="fa-solid fa-lightbulb"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">Electricity Bill</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-yellow-500 text-xl mb-1">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <span class="text-[11px] text-gray-300 leading-tight">Loan Repayment</span>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1e1e1e] border-t border-zinc-800 flex justify-around items-center py-2 z-50">
            <div class="flex flex-col items-center text-purple-400 cursor-pointer">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 cursor-pointer">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
                <span class="text-[10px] mt-1">Search</span>
            </div>
            <div class="flex flex-col items-center -mt-6 cursor-pointer">
                <div class="w-14 h-14 rounded-full bg-purple-600 flex items-center justify-center text-white text-2xl shadow-lg border-4 border-[#121212] active:scale-95 transition-transform">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
            </div>
            <div class="flex flex-col items-center text-gray-400 cursor-pointer">
                <i class="fa-regular fa-bell text-lg"></i>
                <span class="text-[10px] mt-1">Alerts</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 cursor-pointer">
                <i class="fa-regular fa-clock text-lg"></i>
                <span class="text-[10px] mt-1">History</span>
            </div>
        </div>

    </div>

</body>
</html>
